<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Shop Pro | Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container navbar">
      <a class="brand" href="index.html">
        <span class="dot"></span>
        E-Shop Pro
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="cart.html">Cart <span class="badge" id="cart-count">0</span></a>
        <a href="login.html">Login</a>
        <a href="admin.html" class="active">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="flex-between" style="margin: 20px 0;">
      <h2 class="section-title" style="margin: 0;">Admin Dashboard</h2>
      <span class="pill">Simulated backend</span>
    </div>

    <section class="detail-card" style="margin-bottom: 24px;">
      <h3 style="margin-bottom: 12px;">Current Products</h3>
      <div id="admin-product-list" class="grid"></div>
    </section>

    <section class="form">
      <h3 style="margin-bottom: 12px;">Add New Product</h3>
      <div class="form-group">
        <label for="new-name">Name</label>
        <input type="text" id="new-name" placeholder="Product name">
      </div>
      <div class="form-group">
        <label for="new-price">Price</label>
        <input type="number" id="new-price" placeholder="199">
      </div>
      <div class="form-group">
        <label for="new-category">Category</label>
        <input type="text" id="new-category" placeholder="Accessories">
      </div>
      <div class="form-group">
        <label for="new-image">Image URL</label>
        <input type="text" id="new-image" placeholder="https://placehold.co/600x400?text=New">
      </div>
      <div class="form-group">
        <label for="new-description">Description</label>
        <textarea id="new-description" rows="3" placeholder="Describe the product"></textarea>
      </div>
      <button class="btn" onclick="addNewProduct()">Add Product</button>
      <p class="muted" style="margin-top: 10px;">Data is stored locally for this session.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      Quick manage your storefront without servers.
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
